<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.15; stroke-width: 1; }
    .node-pulse {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dash 25s linear infinite;
    }
    .flow-line-rev {
      stroke-dasharray: 6 10;
      animation: dashRev 20s linear infinite;
    }
    .pill-float {
      animation: float 6s ease-in-out infinite alternate;
    }
    .pill-float-2 {
      animation: float 7s ease-in-out infinite alternate-reverse;
    }
    .radar-sweep {
      transform-origin: 1040px 170px;
      animation: rotate 12s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes dashRev {
      to { stroke-dashoffset: 1000; }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" fill="url(#bgGrad)" />

  <!-- Background Geometric Grid -->
  <g>
    <line x1="0" y1="68" x2="1200" y2="68" class="grid-line" />
    <line x1="0" y1="136" x2="1200" y2="136" class="grid-line" />
    <line x1="0" y1="204" x2="1200" y2="204" class="grid-line" />
    <line x1="0" y1="272" x2="1200" y2="272" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="340" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="340" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="340" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="340" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="340" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="340" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="340" class="grid-line" />
  </g>

  <!-- Dynamic Network Background Circuit Lines -->
  <g opacity="0.45">
    <path d="M 50 280 C 250 280, 280 60, 480 60" fill="none" stroke="#0ea5e9" stroke-width="1.5" class="flow-line" />
    <path d="M 120 40 C 320 40, 350 240, 600 240" fill="none" stroke="#6366f1" stroke-width="1" class="flow-line-rev" />
    <path d="M 700 80 C 850 80, 920 260, 1150 260" fill="none" stroke="#10b981" stroke-width="1.5" class="flow-line" />
    <path d="M 620 300 C 800 300, 880 120, 1120 120" fill="none" stroke="#38bdf8" stroke-width="1" class="flow-line-rev" />
  </g>

  <!-- High-Tech Data Protection Cyber Shield Symbol (Right side background decoration) -->
  <g transform="translate(1020, 165)">
    <!-- Radar concentric rings -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#1e293b" stroke-width="1" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5" />
    <circle cx="0" cy="0" r="55" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />

    <!-- Rotating Radar Sweep Beam -->
    <g class="radar-sweep">
      <path d="M 0 0 L 85 -55 A 110 110 0 0 1 110 0 Z" fill="url(#shieldGrad)" opacity="0.15" />
      <line x1="0" y1="0" x2="110" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- Center Shield Icon -->
    <path d="M -30 -40 C 0 -45 0 -45 30 -40 C 30 10 15 45 0 55 C -15 45 -30 10 -30 -40 Z" 
          fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shieldGlow)" opacity="0.85" />
    <!-- Lock core symbol inside shield -->
    <rect x="-10" y="-8" width="20" height="16" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M -6 -8 A 6 6 0 0 1 6 -8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#38bdf8" />
  </g>

  <!-- Left Accent Tech Glow -->
  <circle cx="90" cy="90" r="140" fill="#2563eb" opacity="0.08" filter="url(#glow)" />
  <circle cx="1060" cy="220" r="130" fill="#059669" opacity="0.08" filter="url(#glow)" />

  <!-- Floating Dynamic Feature Pills in Lower Deck -->
  <g class="pill-float">
    <g transform="translate(80, 255)">
      <rect width="185" height="38" rx="19" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="22" cy="19" r="6" fill="#38bdf8" />
      <text x="38" y="24" fill="#e2e8f0" class="badge-text">🛡️ Zero-Trust SaaS</text>
    </g>
    <g transform="translate(280, 255)">
      <rect width="215" height="38" rx="19" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="22" cy="19" r="6" fill="#10b981" />
      <text x="38" y="24" fill="#e2e8f0" class="badge-text">⚡ Immutable Air-Gap</text>
    </g>
    <g transform="translate(510, 255)">
      <rect width="205" height="38" rx="19" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="22" cy="19" r="6" fill="#818cf8" />
      <text x="38" y="24" fill="#e2e8f0" class="badge-text">🔄 Cyber Resilience</text>
    </g>
    <g transform="translate(730, 255)">
      <rect width="195" height="38" rx="19" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="22" cy="19" r="6" fill="#f59e0b" />
      <text x="38" y="24" fill="#e2e8f0" class="badge-text">🔓 Open-Source First</text>
    </g>
  </g>

  <!-- Foreground Main Title & Content (Crisp, High Contrast, Foreground Priority) -->
  <g transform="translate(80, 85)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="12" y="17" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1">AWESOME CURATED LIST</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="url(#textGrad)" class="title-text">Unified SaaS Data Protection Platform</text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="105" class="subtitle-text">
      Enterprise SaaS Resilience • Cloud-Native Air-Gapped Backups • Open-Source Backup Engines
    </text>

    <!-- Subtitle Line 2 -->
    <text x="0" y="132" class="subtitle-text" font-size="14" fill="#64748b">
      Complete Market Intelligence: Pricing Models, Free Tiers, Valuations &amp; GitHub Star Analytics
    </text>
  </g>

  <!-- Top Accent Glowing Border Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#lineGrad1)" />
</svg>
